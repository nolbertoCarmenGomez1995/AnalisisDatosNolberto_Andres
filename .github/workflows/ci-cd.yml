name: CI/CD Pipeline - Web Scraping

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas cloudscraper selenium scrapy

    - name: Validate script syntax
      run: |
        python -m py_compile Actividad1.py

    - name: Run Web Scraping and Generate Dataset
      run: |
        python Actividad1.py

    - name: Verify Dataset Exists
      run: |
        if [ -f "Gomez_Nolberto_Analizando_EA1.csv" ]; then
          echo "Dataset successfully generated!"
          cat Gomez_Nolberto_Analizando_EA1.csv
        else
          echo "Error: Dataset not found!"
          exit 1
        fi